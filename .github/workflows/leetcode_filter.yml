name: Generate Need To Do List

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 6"
  push:
    paths:
      - 'my-folder/**'

jobs:
  check-cpp:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find Problems Missing C++ Submissions
        run: |
          TARGET_DIR="my-folder"
          OUTPUT_FILE="NeedToDo.txt"

          echo "=== Danh sách bài chưa làm bằng C++ ===" > "$OUTPUT_FILE"
          echo "Cập nhật lúc: $(date)" >> "$OUTPUT_FILE"
          echo "-------------------------------------" >> "$OUTPUT_FILE"

          count=0

          if [ -d "$TARGET_DIR" ]; then
            # Duyệt qua từng thư mục bài tập
            for dir in "$TARGET_DIR"/*; do
              if [ -d "$dir" ]; then
                # Dùng find để tìm chính xác xem trong thư mục đó có file C++ nào không (.cpp, .cc, .cxx)
                cpp_files=$(find "$dir" -type f \( -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" \))
                
                # Nếu chuỗi rỗng nghĩa là CHƯA CÓ file C++
                if [ -z "$cpp_files" ]; then
                  folder_name=$(basename "$dir")
                  echo "- $folder_name" >> "$OUTPUT_FILE"
                  count=$((count + 1))
                fi
              fi
            done
          fi

          echo "" >> "$OUTPUT_FILE"
          echo "-------------------------------------" >> "$OUTPUT_FILE"
          echo "Tổng số bài chưa có C++: $count" >> "$OUTPUT_FILE"

      - name: Commit and Push NeedToDo.txt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add NeedToDo.txt
          
          if git diff --staged --quiet; then
            echo "Không có thay đổi trong NeedToDo.txt"
          else
            git commit -m "[Auto] Cập nhật danh sách bài chưa làm C++"
            git push
          fi
